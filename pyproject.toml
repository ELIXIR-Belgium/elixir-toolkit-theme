[project]
name = "elixir-toolkit-theme"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Joshua Baskaran", email = "joshbaskaran@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "frontmatter>=3.0.8",
    "numpy>=2.5.4",
    "pyrefly>=0.60.0",
    "python-frontmatter>=1.3.0",
    "requests>=2.34.2",
    "ruamel-yaml>=0.19.1",
    "urllib3>=2.8.0",
]

[project.scripts]
elixir-toolkit-theme = "elixir_toolkit_theme:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
