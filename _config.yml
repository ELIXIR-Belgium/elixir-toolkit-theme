title: ELIXIR Toolkit Theme
# This appears in the html browser tab for the site title (seen mostly by search engines, not users)

# topnav_title: ELIXIR toolkit theme
# Optional: this appears on the top navigation bar next to the main_logo.svg icon

# topnav_banner: "ELIXIR toolkit theme is currently under development and may change at any point - it is not meant for production use"
# Optional: a banner message to display to users on all pages

description: "Flexible Jekyll theme using bootstrap 5 as CSS framework."
# Metadata description of the website

date_format: "%-d %B %Y"
# default format for displaying dates

dsw_deep_link_prefix: https://researchers.ds-wizard.org/knowledge-models/dsw:root:latest/preview?questionUuid=
# prefix for DSW deep links to a certain question

gtag:
# Google analytics tag

matomo:
# Matomo domain where Matomo is running
matomo_id:
# Integer indicating the Matomo Website ID
matomo_cookies: true
# Boolean that determines whether a Matomo tracking cookie is used or not

plausible:
# Plausible tag
plausible_src:
# default: 'https://plausible.io/js/plausible.js

exclude:
  - .gitignore
  - var/
  - vendor
  - Gemfile*
  - LICENSE

sass:
  style: compressed
  sourcemap: never

collections:
  blog: # corresponds to the _blog folder
    permalink: /blog/:path # e.g. /blog/2026-07-20/example-post.html
    output: true

defaults:
  # Define here page metadata attributes for all pages at once or on specific directories. More information: https://jekyllrb.com/docs/configuration/front-matter-defaults/
  - scope:
      path: ""
      type: "pages"
    values:
      permalink: /:basename
      layout: "page"
      sidebar: main

  - scope:
      path: "_blog" # default settings for blog pages
    values:
      layout: "page"
      sidebar: blog # show separate sidebar for the blog
      dateline: true # show date below title

plugins:
  - elixir-toolkit-theme-plugins
  - jekyll-redirect-from
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-github-metadata
  - jemoji
  - webrick

theme_variables:
  # git_host: GitHub
  # back_to_top: true
  # dev-info-banner: false
  # privacy_statement_url: /privacy
  # github_buttons:
  # position: top
  # edit_me: true
  # open_issue: true
  # history: true
  # datatables:
  # searchbuilder: false
  # pagelength: 10
  # headings:
  # related-pages: Related pages
  # more-information-tiles: More information
  # resource-table-all: Tools and resources on this page
  # resource-table-all-collapse: false
  # page_metadata:
  # contributors_sort: true
  # coordinators_sort: true
  # editors_sort: true
  # supported_by_sort: true
  # toc:
  # min_headings: 1
  # headings: 'h2'
  # topnav:
  # brand_logo: assets/img/main_logo.svg
  # search: true
  # github: true
  # twitter: false
  # bluesky: false
  # linkedin: false
  # fosstodon: false
  # theme_color: 0d6efd
  # fonts:
