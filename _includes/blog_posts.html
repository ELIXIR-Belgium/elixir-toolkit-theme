<ul class="blog-list list-unstyled">
  {% for post in site.blog reversed %}
    <!-- note: posts with a date in the future are hidden by hide-future-posts.js -->
    <li date="{{ post.date | date: '%Y-%m-%d' }}" class="blog-list-item pb-3">
      <h2><a href="{{ post.url | relative_url }}">{{ post.title }}</a><br/></h2>
      <p><em>
        <time datetime="{{ post.date | date_to_xmlschema }}">
           {{ post.date | date: site.date_format }}</time> 
      </em></p>
      {% include contributor-minitiles-page.html contributors_list=post.contributors sort=false%}
      {%- if post.summary %}
        <div class="summary">{{post.summary}}</div>
      {%- endif %}
    </li>
  {% endfor %}
</ul>
